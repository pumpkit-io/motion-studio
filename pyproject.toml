[project]
name = "motion-studio"
version = "0.1.0"
description = "Video editing with a coding agent: talking-head videos for Reels and X, and product videos made from screen recordings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Francesco Paoli Leonardi" }]
dependencies = [
    "typer==0.27.3",
    "rich==15.0.0",
    "pydantic==2.14.1",
    "tomli-w==1.2.0",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "scenedetect==0.7.2",
    "mediapipe==1.1.1",
    "onnxruntime==1.31.0",
    "rapidfuzz==3.14.6",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "pillow==13.0.0",
    "platformdirs==4.13.5",
]

[project.optional-dependencies]
mac = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
cpu = ["faster-whisper==1.2.1"]

[project.scripts]
motion-studio = "motion_studio.cli:app"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.9",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motion_studio"]

# `setup` copies these into the cache and runs `npm ci` there (motion_studio.render.renderer).
[tool.hatch.build.targets.wheel.force-include]
"renderer/package.json" = "motion_studio/_renderer/package.json"
"renderer/package-lock.json" = "motion_studio/_renderer/package-lock.json"
"renderer/tsconfig.json" = "motion_studio/_renderer/tsconfig.json"
"renderer/remotion.config.ts" = "motion_studio/_renderer/remotion.config.ts"
"renderer/src" = "motion_studio/_renderer/src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Ruff also formats Python blocks inside Markdown; the guide and docs keep their own layout.
extend-exclude = ["*.md", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# Restates pyright's defaults, plus agent worktrees under .claude/.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".claude"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/motion_studio/edl", "src/motion_studio/analysis"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "node_modules", "build", "dist", "*.egg", "venv", ".claude"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "slow: long-running integration or e2e test (local only)",
    "mac: needs macOS on Apple Silicon (MLX, VideoToolbox, say)",
    "models: loads ASR, VAD or face models (takes the heavy-model lock)",
    "renderer: needs the installed Remotion renderer",
    "music: needs the ACE-Step environment",
]
