<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recorder fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #111111; font: 16px/1.4 Helvetica, Arial, sans-serif; }
  #title { position: absolute; left: 100px; top: 80px; width: 600px; height: 60px; margin: 0; font-size: 40px; line-height: 60px; }
  #body { position: absolute; left: 100px; top: 180px; width: 700px; height: 120px; margin: 0; font-size: 14px; }
  #go { position: absolute; left: 1200px; top: 600px; width: 200px; height: 60px; font-size: 20px; background: #2b59c3; color: #fff; border: 0; }
  #result { position: absolute; left: 900px; top: 200px; width: 400px; height: 150px; background: #000000; display: none; }
  #result.shown { display: block; }
</style>
</head>
<body>
<h1 id="title">Recorder fixture</h1>
<p id="body">The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. Small text like this must stay readable when the camera zooms in to twice its size.</p>
<button id="go" onclick="document.getElementById('result').classList.add('shown')">Go</button>
<div id="result"></div>
</body>
</html>
