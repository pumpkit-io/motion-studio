# Italian language data for motion-studio.
code = "it"
name = "Italiano"

[asr]
# Biases Whisper towards verbatim output, so it keeps the disfluencies it usually drops.
initial_prompt = "Ehm, allora, cioè, eh, stavo tipo pensando... mmm, diciamo, ehm, sì."

[fillers]
# Matched case-insensitively with punctuation stripped; entries may be several words.
hard = ["ehm", "ehmm", "eh", "mmm", "mh", "uhm", "ah"]
soft = ["cioè", "tipo", "diciamo", "praticamente", "insomma", "boh", "vabbè", "niente"]
soft_at_start = ["allora", "comunque", "ok", "okay"]

[utterances]
incomplete_endings = [
    "il", "lo", "la", "i", "gli", "le", "un", "uno", "una",
    "e", "o", "ma", "perché", "che", "cui", "quindi", "però",
    "di", "a", "da", "in", "con", "su", "per", "tra", "fra",
    "del", "dello", "della", "dei", "degli", "delle", "al", "allo", "alla", "ai", "agli", "alle",
    "nel", "nello", "nella", "nei", "negli", "nelle", "sul", "sulla",
    "è", "sono", "era", "ho", "hai", "ha", "abbiamo", "hanno", "mi", "ti", "si", "ci", "vi",
    "mio", "mia", "tuo", "tua", "suo", "sua",
]

[captions]
max_chars_per_page = 20
keep_with_next = [
    "il", "lo", "la", "i", "gli", "le", "un", "una", "e", "o", "di", "a", "da", "in",
    "con", "su", "per", "che", "non",
]
