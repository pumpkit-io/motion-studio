# English language data for motion-studio. To add a language, copy this file to <code>.toml.
code = "en"
name = "English"

[asr]
# Biases Whisper towards verbatim output, so it keeps the disfluencies it usually drops.
initial_prompt = "Umm, so, uh, I was like, hmm, thinking... you know, um, yeah."

[fillers]
# Matched case-insensitively with punctuation stripped; entries may be several words.
hard = ["um", "umm", "uh", "uhm", "er", "erm", "hmm", "mm", "mhm"]
soft = ["like", "you know", "I mean", "basically", "actually"]
soft_at_start = ["so", "right", "okay"]

[utterances]
incomplete_endings = [
    "a", "an", "the", "and", "or", "but", "because", "so", "that", "which", "who",
    "to", "of", "in", "on", "at", "for", "with", "from", "by", "about", "into",
    "is", "are", "was", "were", "be", "been", "am", "will", "would", "can", "could",
    "should", "have", "has", "had", "do", "does", "my", "your", "our", "their", "his", "her",
]

[captions]
max_chars_per_page = 22
keep_with_next = ["a", "an", "the", "to", "of", "and", "or", "in", "on", "at", "my", "your"]
